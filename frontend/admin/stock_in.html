<div class="container mt-4"><div class="card shadow p-4 border-0"><h4 class="fw-bold" style="color:#123765;">Stock In Form</h4>
<form id="stockForm">
<div id="stockRows">
 <div class="row stock-row border rounded p-3 mb-3 align-items-end">
  <div class="col-md-3 mb-2"><label class="form-label fw-bold">Select Item</label><select name="item_id[]" class="form-select select-item" required></select></div>
  <div class="col-md-3 mb-2"><label class="form-label fw-bold">Supplier</label><input type="text" name="supplier[]" class="form-control" placeholder="Supplier Name"></div>
  <div class="col-md-2 mb-2"><label class="form-label fw-bold">Date</label><input type="date" name="stock_date[]" class="form-control date-field" required></div>
  <div class="col-md-1 mb-2"><label class="form-label fw-bold">Qty</label><input type="number" name="qty_in[]" min="1" class="form-control" required></div>
  <div class="col-md-2 mb-2"><label class="form-label fw-bold">Remarks</label><input type="text" name="remarks[]" class="form-control"></div>
  <div class="col-md-1 mb-2"><button type="button" class="btn btn-danger w-100 remove-row"><i class="bi bi-dash-circle"></i></button></div>
 </div>
</div>
<button type="button" id="addRow" class="btn btn-secondary fw-bold mb-3"><i class="bi bi-plus-circle"></i> Add Another Item</button>
<button class="btn w-100 text-white fw-bold" style="background:#123765;">Save Stock In</button>
</form></div></div></div></div>
<script src="/stlaf_wip_supplies_ledger/assets/bootstrap/bootstrap.bundle.min.js"></script>
<script src="/stlaf_wip_supplies_ledger/frontend/admin/assets/admin.js"></script>
<script>
async function loadItems(){ const res = await fetch('/stlaf_wip_supplies_ledger/backend/admin/inventory_json.php?limit=1000',{credentials:'include'}); const j=await res.json(); const selects = document.querySelectorAll('.select-item'); selects.forEach(s=>{ s.innerHTML = '<option value="">-- Select Item --</option>' + j.items.map(it=>`<option value="${it.id}">${it.description} (On Hand: ${it.qty_on_hand} ${it.unit})</option>`).join(''); }); }

document.getElementById('addRow').addEventListener('click', function(){ const row = document.querySelector('.stock-row').cloneNode(true); row.querySelectorAll('input').forEach(i=>i.value=''); row.querySelectorAll('select').forEach(s=>s.value=''); document.getElementById('stockRows').appendChild(row); loadItems(); });
document.addEventListener('click', function(e){ if(e.target.classList && e.target.classList.contains('remove-row') && document.querySelectorAll('.stock-row').length>1) e.target.closest('.stock-row').remove(); });

document.getElementById('stockForm').addEventListener('submit', async function(e){ e.preventDefault(); const form = new FormData(this); const res = await fetch('/stlaf_wip_supplies_ledger/backend/admin/stock_in_submit.php',{method:'POST', credentials:'include', body: form}); const j=await res.json(); if(j.success){ alert('Saved'); location.reload(); } else alert('Failed'); });

document.addEventListener('DOMContentLoaded', function(){ loadItems(); document.querySelectorAll('.date-field').forEach(d=>{ if(!d.value) d.value = new Date().toISOString().slice(0,10); }); });
</script>
