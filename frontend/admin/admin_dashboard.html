    <script>
        function escapeHtml(s) { return String(s||'').replace(/[&<>"]+/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c] || c)); }

        function renderRequests(requests, filterStatus) {
            const filtered = requests.filter(r => (r.status || '').toLowerCase() === (filterStatus || '').toLowerCase());
            if (!filtered.length) return `<div class="text-center text-muted py-3">No ${escapeHtml(filterStatus)} requests found.</div>`;

            const rows = filtered.map(r => {
                const status = (r.status || '').toLowerCase();
                const badge = status === 'delivered' ? 'success' : (status === 'cancelled' ? 'danger' : 'secondary');
                return `
                    <tr>
                        <td><span class="fw-bold text-primary">${escapeHtml(r.req_id)}</span></td>
                        <td>${escapeHtml(r.name)}</td>
                        <td>${escapeHtml(r.department)}</td>
                        <td>${escapeHtml(r.item)}</td>
                        <td>${escapeHtml(r.size)}</td>
                        <td>${escapeHtml(r.quantity)}</td>
                        <td>${escapeHtml(r.unit)}</td>
                        <td><span class="badge bg-${badge} px-3 py-2 shadow-sm">${escapeHtml(r.status)}</span></td>
                        ${filterStatus.toLowerCase() === 'cancelled' ? `<td>${escapeHtml(r.cancel_reason || 'N/A')}</td>` : ''}
                    </tr>`;
            }).join('');

            return `
                <div class="table-responsive elegant-table mt-3" style="max-height: 600px; overflow-y: auto;">
                    <table class="table table-hover align-middle mb-0 text-center">
                        <thead class="table-primary">
                            <tr>
                                <th>Request ID</th>
                                <th>Name</th>
                                <th>Department</th>
                                <th>Item</th>
                                <th>Size</th>
                                <th>Quantity</th>
                                <th>Unit</th>
                                <th>Status</th>
                                ${filterStatus.toLowerCase() === 'cancelled' ? '<th>Reason</th>' : ''}
                            </tr>
                        </thead>
                        <tbody>
                            ${rows}
                        </tbody>
                    </table>
                </div>`;
        }

        async function loadAllAndRender() {
            try {
                const res = await fetch('/stlaf_wip_supplies_ledger/backend/admin/admin_requests_json.php', { credentials: 'include' });
                if (!res.ok) { throw new Error('network'); }
                const requests = await res.json();

                document.getElementById('approvedContent').innerHTML = renderRequests(requests, 'Approved');
                document.getElementById('declinedContent').innerHTML = renderRequests(requests, 'Cancelled');
                document.getElementById('deliveredContent').innerHTML = renderRequests(requests, 'Delivered');

                // Wire search to filter rendered rows
                const searchInput = document.getElementById('searchInput');
                let timeout;
                searchInput.addEventListener('input', () => {
                    clearTimeout(timeout);
                    timeout = setTimeout(() => {
                        const q = searchInput.value.toLowerCase();
                        document.querySelectorAll('.tab-pane .table tbody tr').forEach(tr => {
                            tr.style.display = tr.innerText.toLowerCase().includes(q) ? '' : 'none';
                        });
                    }, 200);
                });

            } catch (e) {
                document.getElementById('approvedContent').innerText = 'Error loading';
                document.getElementById('declinedContent').innerText = 'Error loading';
                document.getElementById('deliveredContent').innerText = 'Error loading';
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadAllAndRender();
            // Optional: poll every 60s
            setInterval(loadAllAndRender, 60000);
        });
    </script>
