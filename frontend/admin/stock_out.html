<script>
async function loadLedger(){ const res = await fetch('/stlaf_wip_supplies_ledger/backend/admin/stock_out_json.php',{credentials:'include'}); if(!res.ok) return; const j=await res.json(); const b=document.getElementById('ledgerBody'); b.innerHTML=''; j.ledger.forEach(r=>{ const tr=document.createElement('tr'); tr.innerHTML = `<td>${r.description}</td><td class="text-center">${r.qty_out}</td><td class="text-center">${r.date_out||''}</td>`; b.appendChild(tr); }); }

document.getElementById('searchInput').addEventListener('keyup', function(){ const v=this.value.toLowerCase(); document.querySelectorAll('#ledgerBody tr').forEach(tr=> tr.style.display = tr.innerText.toLowerCase().includes(v)?'':'none'); });
window.addEventListener('DOMContentLoaded', ()=> loadLedger());
</script>
