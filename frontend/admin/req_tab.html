    <script src="/stlaf_wip_supplies_ledger/assets/bootstrap/bootstrap.bundle.min.js"></script>

<script src="/stlaf_wip_supplies_ledger/frontend/admin/assets/admin.js"></script>

    <script>
        function escapeHtml(s) { return String(s||'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c] || c)); }

        function renderPending(requests) {
            const pending = requests.filter(r => !['cancelled','delivered'].includes((r.status||'').toLowerCase()));
            if (!pending.length) return `<div class="text-center text-muted py-3">No requests available.</div>`;

            const rows = pending.map(r => {
                const status = (r.status||'').toLowerCase();
                const badge = status === 'pending' ? 'secondary' : (status === 'approved' ? 'success' : 'secondary');
                const actions = [];
                if (status === 'pending') {
                    actions.push(`<button onclick="updateRequestStatus(${r.req_id}, 'Approved')" class="btn btn-success btn-sm px-2 shadow-sm">Approve</button>`);
                    actions.push(`<button onclick="openDeclineModal(${r.req_id})" class="btn btn-danger btn-sm px-2 shadow-sm">Decline</button>`);
                } else if (status === 'approved') {
                    actions.push(`<button onclick="updateRequestStatus(${r.req_id}, 'Delivered')" class="btn btn-primary btn-sm px-2 shadow-sm">Delivered</button>`);
                }
                actions.push(`<button onclick="deleteRequest(${r.req_id})" class="btn btn-outline-danger btn-sm px-2 shadow-sm"><i class="bi bi-trash"></i></button>`);

                return `
                    <tr class="text-center">
                        <td><span class="fw-bold text-primary">${escapeHtml(r.req_id)}</span></td>
                        <td>${escapeHtml(r.name)}</td>
                        <td>${escapeHtml(r.department)}</td>
                        <td>${escapeHtml(r.item)}</td>
                        <td>${escapeHtml(r.quantity)}</td>
                        <td>${escapeHtml(r.unit)}</td>
                        <td><span class="badge bg-${badge} px-3 py-2 shadow-sm">${escapeHtml(r.status)}</span></td>
                        <td>${actions.join(' ')}</td>
                    </tr>`;
            }).join('');

            return `
                <table class="table table-hover align-middle mb-0">
                    <thead class="text-center">
                        <tr>
                            <th>Request ID</th>
                            <th>Name</th>
                            <th>Department</th>
                            <th>Item</th>
                            <th>Quantity</th>
                            <th>Unit</th>
                            <th>Status</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="requestTableBody">
                        ${rows}
                    </tbody>
                </table>`;
        }

        async function loadPendingRequests() {
            try {
                const res = await fetch('/stlaf_wip_supplies_ledger/backend/admin/admin_requests_json.php', { credentials: 'include' });
                if (!res.ok) throw new Error('network');
                const requests = await res.json();
                document.getElementById('requestsWrapper').innerHTML = renderPending(requests);
            } catch (e) {
                console.error('Fetch error:', e);
            }
        }

        function openDeclineModal(id) {
            const modal = new bootstrap.Modal(document.getElementById('declineModal'));
            document.getElementById('declineRequestId').value = id;
            modal.show();
        }

        async function updateRequestStatus(id, status) {
            try {
                const form = new URLSearchParams();
                form.append('method', 'updateStatus');
                form.append('req_id', id);
                form.append('status', status);

                const res = await fetch('/stlaf_wip_supplies_ledger/backend/admin/update_status.php', {
                    method: 'POST',
                    credentials: 'include',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: form.toString()
                });
                const json = await res.json();
                if (json.status === 'success') { showToast('Request ' + status.toLowerCase() + '.', true); loadPendingRequests(); }
                else showToast('Failed: ' + (json.message || 'unknown'), false);
            } catch (e) {
                console.error('Update error', e);
                showToast('Connection error.', false);
            }
        }

        async function deleteRequest(reqId) {
            if (!confirm('Are you sure you want to permanently delete this request?')) return;
            try {
                const form = new URLSearchParams();
                form.append('request_id', reqId);
                const res = await fetch('/stlaf_wip_supplies_ledger/backend/admin/delete_request.php', {
                    method: 'POST',
                    credentials: 'include',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: form.toString()
                });
                const text = await res.text();
                if (text.trim() === 'success') { showToast('Request deleted.', true); loadPendingRequests(); }
                else showToast('Delete failed: ' + text, false);
            } catch (e) {
                console.error('Delete error:', e);
                showToast('Connection error.', false);
            }
        }

        document.addEventListener('DOMContentLoaded', function() {
            loadPendingRequests();
            setInterval(loadPendingRequests, 3000);

            const searchInput = document.getElementById('searchInput');
            searchInput.addEventListener('keyup', function() {
                const filter = searchInput.value.toLowerCase().trim();
                document.querySelectorAll('#requestTableBody tr').forEach(row => {
                    row.style.display = row.innerText.toLowerCase().includes(filter) ? '' : 'none';
                });
            });

            // decline form submit
            document.getElementById('declineForm').addEventListener('submit', async function(e) {
                e.preventDefault();
                const id = document.getElementById('declineRequestId').value;
                const reason = this.reason.value;
                try {
                    const form = new URLSearchParams();
                    form.append('method', 'updateStatus');
                    form.append('req_id', id);
                    form.append('status', 'Cancelled');
                    form.append('reason', reason);

                    const res = await fetch('/stlaf_wip_supplies_ledger/backend/admin/update_status.php', {
                        method: 'POST',
                        credentials: 'include',
                        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                        body: form.toString()
                    });
                    const json = await res.json();
                    if (json.status === 'success') {
                        showToast('Request declined.', true);
                        loadPendingRequests();
                        bootstrap.Modal.getInstance(document.getElementById('declineModal')).hide();
                    } else {
                        showToast('Failed: ' + (json.message || 'unknown'), false);
                    }
                } catch (e) {
                    console.error('Decline error', e);
                    showToast('Connection error.', false);
                }
            });
        });
    </script>
