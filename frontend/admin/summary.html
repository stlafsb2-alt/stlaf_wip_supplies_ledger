<select name="month" id="monthSelect" class="form-select"><option value="">All Months</option></select>
<select name="year" id="yearSelect" class="form-select"><option value="">All Years</option></select>

<h3 class="fw-bold mb-4 text-center">Stock Out Statistics</h3>

<script>
(function(){ const monthSelect=document.getElementById('monthSelect'); for(let m=1;m<=12;m++){const opt=document.createElement('option'); opt.value=m; opt.text = new Date(2020,m-1,1).toLocaleString('default',{month:'long'}); monthSelect.appendChild(opt);} const yearSelect=document.getElementById('yearSelect'); const start=2024; const cur=new Date().getFullYear(); for(let y=cur;y>=start;y--){const o=document.createElement('option'); o.value=y; o.text=y; yearSelect.appendChild(o);} })();

let chart;
let maxYValue = null; // fixed ceiling, set once from the first (unfiltered) load so the axis doesn't jump around when the filter changes
async function loadStats(){ const month=document.getElementById('monthSelect').value; const year=document.getElementById('yearSelect').value; const url=`/stlaf_wip_supplies_ledger/backend/admin/summary_json.php?month=${encodeURIComponent(month)}&year=${encodeURIComponent(year)}`; const res = await fetch(url,{credentials:'include'}); const j=await res.json(); const stats=j.stats||[]; const labels=stats.map(s=>s.description); const data=stats.map(s=>Number(s.total_qty_out)); if(maxYValue===null){ maxYValue = data.length ? Math.max(...data) : 0; } const ctx=document.getElementById('stockOutChart').getContext('2d'); if(chart) chart.destroy(); chart=new Chart(ctx,{type:'bar', data:{labels, datasets:[{label:'Qty Out', data, backgroundColor:'rgba(54,162,235,0.6)'}]}, options:{plugins:{legend:{display:false}}, scales:{y:{beginAtZero:true, max:maxYValue}}}}); }

document.getElementById('monthSelect').addEventListener('change', loadStats); document.getElementById('yearSelect').addEventListener('change', loadStats);
window.addEventListener('DOMContentLoaded', loadStats);

document.getElementById('downloadSummary').addEventListener('click', function(e){
	e.preventDefault();
	const month=document.getElementById('monthSelect').value;
	const year=document.getElementById('yearSelect').value;
	// open existing server PDF generator in a new tab
	const url = `/stlaf_wip_supplies_ledger/backend/admin/download_summary.php?month=${encodeURIComponent(month)}&year=${encodeURIComponent(year)}`;
	window.open(url, '_blank');
});

document.getElementById('downloadDetailed').addEventListener('click', function(e){
	e.preventDefault();
	const month=document.getElementById('monthSelect').value;
	const year=document.getElementById('yearSelect').value;
	const url = `/stlaf_wip_supplies_ledger/backend/admin/download_detailed_records.php?month=${encodeURIComponent(month)}&year=${encodeURIComponent(year)}`;
	window.open(url, '_blank');
});

</script>
