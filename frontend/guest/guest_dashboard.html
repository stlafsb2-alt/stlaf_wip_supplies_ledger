<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width,initial-scale=1">
	<title>STLAF | Guest Dashboard</title>
	<link rel="stylesheet" href="/stlaf_wip_supplies_ledger/assets/bootstrap/bootstrap.min.css">
	<link rel="stylesheet" href="/stlaf_wip_supplies_ledger/assets/css/index.css">
	<link rel="stylesheet" href="/stlaf_wip_supplies_ledger/frontend/guest/assets/style.css">
	<link rel="icon" href="/stlaf_wip_supplies_ledger/assets/images/sub_logo_light.png">
</head>
<body>
<nav class="navbar px-4 bg-light"><div class="d-flex align-items-center"><img src="/stlaf_wip_supplies_ledger/assets/images/official_logo.png" width="80"></div><div><a href="/stlaf_wip_supplies_ledger/logout.php"><button class="logout-btn">Logout</button></a></div></nav>
<div class="container-fluid mt-4">
	<div class="row g-4">
		<div class="col-md-4">
			<div class="card shadow p-4" style="height:85vh; overflow:auto;">
				<h4 class="fw-bold">Submit Supply Request</h4>
				<form id="requestForm">
					<div class="mb-2"><label class="form-label">Your Name</label><input name="name" class="form-control" required></div>
					<div class="mb-2"><label class="form-label">Department</label>
						<select name="department" class="form-select" id="departmentSelect"><option value="" disabled selected>Select department</option><option value="all">All Departments</option><option value="hr">HR</option><option value="accounting">Accounting</option><option value="corporate">Corporate</option><option value="litigation">Litigation</option><option value="marketing">Marketing</option><option value="it">IT</option><option value="ops">Operations</option><option value="admin">Admin</option></select>
					</div>
					<hr>
					<div class="mb-2">
						<label class="form-label">Item</label>
						<input id="itemSearch" class="form-control" placeholder="Type to search..." autocomplete="off">
						<div id="itemList" class="list-group position-relative"></div>
					</div>
					<div class="row g-2 mb-2">
						<div class="col-md-6"><input id="quantityField" type="number" class="form-control" placeholder="Qty"></div>
						<div class="col-md-6"><input id="unitField" class="form-control" readonly placeholder="Unit"></div>
					</div>
					<button id="addItemBtn" type="button" class="btn btn-outline-secondary w-100 mb-2">+ Add Item</button>
					<div class="table-responsive"><table class="table table-sm" id="itemsTable"><thead><tr><th>Item</th><th>Product ID</th><th>Qty</th><th>Unit</th><th></th></tr></thead><tbody></tbody></table></div>
					<div class="d-flex gap-2 mt-2"><button id="cancelBtn" type="button" class="btn btn-outline-secondary">Cancel</button><button type="submit" class="btn btn-primary">Submit Request</button></div>
				</form>
			</div>
		</div>
		<div class="col-md-8">
			<div class="card shadow p-4" style="height:85vh; overflow:auto;">
				<div class="d-flex justify-content-between mb-2"><h4 class="m-0">All Requests</h4><input id="searchInput" class="form-control w-25" placeholder="🔍 Search..."></div>
				<div class="table-responsive"><table class="table table-bordered table-hover text-center align-middle" id="requestsTable"><thead class="table-primary"><tr><th>#</th><th>Name</th><th>Item</th><th>Qty</th><th>Unit</th><th>Department</th><th>Status</th><th>Date Requested</th></tr></thead><tbody id="requestsBody">Loading...</tbody></table></div>
			</div>
		</div>
	</div>
</div>
<script src="/stlaf_wip_supplies_ledger/assets/bootstrap/bootstrap.bundle.min.js"></script>
<script>
let itemsCache = [];
async function loadItems(){ const res = await fetch('/stlaf_wip_supplies_ledger/backend/guest/items_json.php',{credentials:'include'}); if(!res.ok) return; const j=await res.json(); itemsCache = j.items||[]; }
async function loadRequests(){ const res = await fetch('/stlaf_wip_supplies_ledger/backend/guest/requests_json.php',{credentials:'include'}); if(!res.ok) return; const j=await res.json(); const body=document.getElementById('requestsBody'); body.innerHTML=''; (j.requests||[]).forEach(r=>{ const tr=document.createElement('tr'); tr.innerHTML=`<td>${r.req_id}</td><td>${r.name}</td><td>${r.item}</td><td>${r.quantity}</td><td>${r.unit}</td><td>${r.department}</td><td>${r.status}</td><td>${r.date_req}</td>`; body.appendChild(tr); }); }

document.getElementById('itemSearch').addEventListener('input', function(){ const v=this.value.toLowerCase(); const list=document.getElementById('itemList'); list.innerHTML=''; if(!v) return; itemsCache.filter(i=>i.description.toLowerCase().includes(v)).slice(0,8).forEach(it=>{ const a=document.createElement('button'); a.type='button'; a.className='list-group-item list-group-item-action'; a.textContent = it.description + ' ('+it.unit+')'; a.dataset.id = it.id; a.dataset.unit = it.unit; a.addEventListener('click', ()=>{ document.getElementById('itemSearch').value = it.description; document.getElementById('unitField').value = it.unit; document.getElementById('itemList').innerHTML=''; document.getElementById('itemSearch').dataset.selected = it.id; }); list.appendChild(a); }); });

document.getElementById('addItemBtn').addEventListener('click', function(){ const name=document.getElementById('itemSearch').value; const id=document.getElementById('itemSearch').dataset.selected||''; const qty=document.getElementById('quantityField').value||0; const unit=document.getElementById('unitField').value||''; if(!name||!id||!qty) return alert('Select item and quantity'); const tbody=document.querySelector('#itemsTable tbody'); const tr=document.createElement('tr'); tr.innerHTML=`<td>${name}<input type="hidden" name="item[]" value="${name}"><input type="hidden" name="product_id[]" value="${id}"></td><td class="text-center">${id}</td><td class="text-center"><input type="hidden" name="quantity[]" value="${qty}">${qty}</td><td class="text-center"><input type="hidden" name="unit[]" value="${unit}">${unit}</td><td class="text-center"><button class="btn btn-sm btn-danger remove">×</button></td>`; tbody.appendChild(tr); tr.querySelector('.remove').addEventListener('click', ()=>tr.remove()); document.getElementById('itemSearch').value=''; document.getElementById('unitField').value=''; document.getElementById('quantityField').value=''; });

document.getElementById('requestForm').addEventListener('submit', async function(e){ e.preventDefault(); const form = new FormData(this); // collect dynamic inputs
	document.querySelectorAll('#itemsTable tbody input').forEach(i=> form.append(i.name, i.value));
	const res = await fetch('/stlaf_wip_supplies_ledger/backend/guest/request_submit.php',{method:'POST', credentials:'include', body: form}); const j=await res.json(); if(j.status==='success'){ alert('Submitted'); loadRequests(); document.querySelector('#itemsTable tbody').innerHTML=''; } else alert(j.message||'Failed'); });

document.getElementById('searchInput').addEventListener('input', function(){ const v=this.value.toLowerCase(); document.querySelectorAll('#requestsBody tr').forEach(tr=> tr.style.display = tr.innerText.toLowerCase().includes(v)?'':'none'); });

window.addEventListener('DOMContentLoaded', async ()=>{ await loadItems(); await loadRequests(); });
</script>
</body>
</html>
